<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de gastos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f8f5ef;--ink:#27231e;--mu:#9a9183;--ln:#e8e1d4;--sel:#f0eadf;--neg:#b5543a;--pos:#3f6b4a;
--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--ink:#eee8da;--mu:#8f867a;--ln:#2a2621;--sel:#211e19;--neg:#e0937a;--pos:#8cbd98}}
:root[data-theme="dark"]{--bg:#171512;--ink:#eee8da;--mu:#8f867a;--ln:#2a2621;--sel:#211e19;--neg:#e0937a;--pos:#8cbd98}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:32px 26px 72px;min-height:100vh}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
.brand{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--mu)}
.ghost{background:none;border:0;color:var(--mu);font:400 13px var(--sans);cursor:pointer;padding:4px 0}
.ghost:hover{color:var(--ink)}
.lbl{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.bal{font-family:var(--serif);font-size:68px;font-weight:400;letter-spacing:-.035em;line-height:1;margin:14px 0 18px}
.line{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14px}
h1{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.02em;line-height:1.15;margin:72px 0 8px}
.mu{color:var(--mu)}
.opts{margin-top:26px;display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--sel);border:0;border-radius:14px;padding:22px 22px;font-family:var(--serif);font-size:23px;font-weight:400;color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s}
.opt:active{transform:scale(.985)}
.opt .sg{font-family:var(--mono);font-size:20px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:30px 0 26px}
.chip{background:var(--sel);border:0;border-radius:12px;padding:15px 14px;font:400 15px var(--sans);color:var(--ink);cursor:pointer;text-align:left;transition:background .15s}
.chip.on{background:var(--ink);color:var(--bg)}
input[type=text],input[type=number]{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:none;color:var(--ink);font:400 16px var(--sans)}
input::placeholder{color:var(--mu)}
input:focus{outline:none;border-bottom-color:var(--ink)}
.fecha{margin:18px 0 0;font-size:13px;color:var(--mu)}
.fecha b{color:var(--ink);font-weight:400;text-transform:capitalize}
.btn{width:100%;margin-top:40px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:16px;font:500 15px var(--sans);cursor:pointer}
.btn.alt{background:var(--sel);color:var(--ink);margin:0 0 30px}
.btn:disabled{opacity:.25;cursor:default}
.amt{font-family:var(--serif)!important;font-size:64px!important;font-weight:400!important;letter-spacing:-.035em;text-align:left;padding:22px 0 10px!important}
.tag{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:22px}
.mes{display:flex;justify-content:space-between;align-items:center;margin:0 0 30px}
.mes button{background:none;border:0;color:var(--mu);width:34px;height:34px;cursor:pointer;font-size:22px;line-height:1}
.mes button:hover{color:var(--ink)}
.mes b{font-family:var(--serif);font-size:20px;font-weight:400;text-transform:capitalize}
.item{display:grid;grid-template-columns:50px 1fr auto 20px;gap:10px;align-items:baseline;padding:15px 0;border-top:1px solid var(--ln)}
.d{font-size:12px;color:var(--mu)}
.m{min-width:0}.m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m small{color:var(--mu);font-size:12px}
.item b{font-weight:400;font-size:14px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.x{background:none;border:0;color:var(--ln);cursor:pointer;font-size:17px;padding:0}
.x:hover{color:var(--neg)}
.empty{color:var(--mu);padding:30px 0;font-family:var(--serif);font-style:italic;font-size:17px;border-top:1px solid var(--ln)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const CATS={
  gasto:['Comida','Transporte','Hogar','Ocio','Salud','Escuela','Compras','Otros'],
  ingreso:['Sueldo','Trabajo_extra','Pensión','Regalo','Venta','Otros']
};
const lbl=c=>c.replace(/_/g,' ');
let S={movs:[]};
try{const r=localStorage.getItem('gastos_v2');if(r)S=JSON.parse(r)}catch(e){}
try{S.movs.forEach(g=>{if(g.c==='Beca_o_apoyo')g.c='Pensión'})}catch(e){}
const save=()=>{try{localStorage.setItem('gastos_v2',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let view='home',draft={tipo:null,cat:null,nota:''},cur=new Date();cur.setDate(1);

function go(v){view=v;render();window.scrollTo(0,0)}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2000)}

function render(){
  const a=$('app');
  if(view==='home'){
    const now=new Date(),km=ymd(now).slice(0,7),disp=S.movs.reduce((s,g)=>s+(g.t==='ingreso'?g.m:-g.m),0),gm=S.movs.filter(g=>g.t==='gasto'&&g.f.startsWith(km)).reduce((s,g)=>s+g.m,0),mn=now.toLocaleDateString('es-MX',{month:'long'});
    a.innerHTML=`<div class="top"><span class="brand">Cuaderno de gastos</span><button class="ghost" id="ver">Movimientos</button></div>
    <div class="lbl">Dinero disponible</div>
    <div class="bal ${disp<0?'neg':''}">${money(disp)}</div>
    <div class="line"><span class="mu">Gastos de ${mn}</span><b class="mono neg" style="font-weight:500">${money(gm)}</b></div>
    <h1>¿Qué vas a registrar?</h1>
    <div class="opts">
      <button class="opt" data-t="gasto"><span>Gasto</span><span class="sg neg">−</span></button>
      <button class="opt" data-t="ingreso"><span>Ingreso</span><span class="sg pos">+</span></button>
    </div>`;
    $('ver').onclick=()=>go('movs');
    a.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{draft={tipo:b.dataset.t,cat:null,nota:''};go('tipo')});
  }
  else if(view==='tipo'){
    const hoy=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    a.innerHTML=`<div class="top"><button class="ghost" id="back">Atrás</button><span class="brand">Nuevo ${draft.tipo}</span></div>
    <h1 style="margin-top:0">Tipo de ${draft.tipo}</h1><div class="mu">Elige una categoría y, si quieres, escribe una nota.</div>
    <div class="chips">${CATS[draft.tipo].map(c=>`<button class="chip${draft.cat===c?' on':''}" data-c="${c}">${lbl(c)}</button>`).join('')}</div>
    <input type="text" id="nota" placeholder="Nota (opcional)" maxlength="60" value="${esc(draft.nota)}">
    <div class="fecha">Fecha: <b>${hoy}</b> · automática</div>
    <button class="btn" id="sig" ${draft.cat?'':'disabled'}>Continuar</button>`;
    $('back').onclick=()=>go('home');
    $('nota').oninput=e=>draft.nota=e.target.value;
    a.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{draft.cat=b.dataset.c;a.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));$('sig').disabled=false});
    $('sig').onclick=()=>draft.cat&&go('importe');
  }
  else if(view==='importe'){
    a.innerHTML=`<div class="top"><button class="ghost" id="back">Atrás</button><span class="brand">Nuevo ${draft.tipo}</span></div>
    <h1 style="margin-top:0">Importe</h1><div class="mu">¿Cuánto fue?</div>
    <div class="tag">${lbl(draft.cat)} · ${draft.tipo}</div>
    <input class="amt" type="number" id="monto" inputmode="decimal" step="0.01" min="0.01" placeholder="$0.00" autofocus>
    <button class="btn" id="ok" disabled>Guardar ${draft.tipo}</button>`;
    const m=$('monto');
    m.oninput=()=>$('ok').disabled=!(parseFloat(m.value)>0);
    $('back').onclick=()=>go('tipo');
    $('ok').onclick=()=>{
      const v=parseFloat(m.value);if(!(v>0))return;
      const now=new Date();
      S.movs.push({id:now.getTime(),t:draft.tipo,c:draft.cat,n:draft.nota.trim(),m:v,f:ymd(now)});
      save();cur=new Date(now.getFullYear(),now.getMonth(),1);
      draft={tipo:null,cat:null,nota:''};toast('Guardado');go('home');
    };
    m.focus();
  }
  else{
    const k=ymd(cur).slice(0,7),items=S.movs.filter(g=>g.f.startsWith(k)).sort((a,b)=>b.id-a.id);
    const ing=items.filter(g=>g.t==='ingreso').reduce((s,g)=>s+g.m,0),gas=items.filter(g=>g.t==='gasto').reduce((s,g)=>s+g.m,0),bal=ing-gas;
    a.innerHTML=`<div class="top"><button class="ghost" id="back">Inicio</button><span class="brand">Movimientos</span></div>
    <div class="mes"><button id="p" aria-label="Mes anterior">‹</button><b>${cur.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</b><button id="n" aria-label="Mes siguiente">›</button></div>
    <div class="lbl">Balance del mes</div>
    <div class="bal ${bal<0?'neg':''}" style="font-size:52px">${money(bal)}</div>
    <div class="line"><span class="mu">Ingresos</span><b class="mono pos" style="font-weight:500">${money(ing)}</b></div>
    <div class="line" style="margin-bottom:36px"><span class="mu">Gastos</span><b class="mono neg" style="font-weight:500">${money(gas)}</b></div>
    <button class="btn alt" id="pdf" ${items.length?'':'hidden'}>Exportar PDF de este mes</button>
    <div>${items.length?items.map(g=>{
      const d=new Date(g.f+'T00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}),neg=g.t==='gasto';
      return `<div class="item"><span class="d mono">${d}</span><div class="m"><div>${esc(g.n||lbl(g.c))}</div>${g.n?`<small>${lbl(g.c)}</small>`:''}</div><b class="mono ${neg?'neg':'pos'}">${neg?'−':'+'}${money(g.m)}</b><button class="x" data-id="${g.id}" aria-label="Eliminar">×</button></div>`}).join(''):'<div class="empty">Sin movimientos este mes.</div>'}</div>`;
    $('back').onclick=()=>go('home');
    $('p').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
    $('pdf').onclick=()=>exportPDF(k,items,ing,gas);
    $('n').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
    a.querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.movs=S.movs.filter(g=>String(g.id)!==b.dataset.id);save();render()});
  }
}
let DL=null;
try{claude.use('downloads').then(d=>{DL=d;if(d&&view==='movs')render()}).catch(()=>{})}catch(e){}
async function exportPDF(k,items,ing,gas){
  if(!window.jspdf)return toast('PDF no disponible');
  try{
    const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'}),W=612,M=48;let y=64;
    const mes=new Date(k+'-01T00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    const f=(sz,b,fam)=>{doc.setFont(fam||'helvetica',b?'bold':'normal');doc.setFontSize(sz)};
    const m2=n=>'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
    f(24,1,'times');doc.text('Cuaderno de gastos',M,y);y+=22;
    f(12,0,'times');doc.text(mes.charAt(0).toUpperCase()+mes.slice(1),M,y);y+=12;doc.setLineWidth(1.5);doc.line(M,y,W-M,y);doc.setLineWidth(.5);y+=24;
    f(11);doc.text('Ingresos: '+m2(ing),M,y);doc.text('Gastos: '+m2(gas),M+170,y);doc.text('Balance: '+m2(ing-gas),M+320,y);y+=34;
    const sec=(titulo,t)=>{
      const l=items.filter(g=>g.t===t).sort((a,b)=>a.f.localeCompare(b.f)||a.id-b.id);
      f(15,1,'times');doc.text(titulo,M,y);y+=8;doc.line(M,y,W-M,y);y+=16;
      if(!l.length){f(10);doc.text('Sin registros',M,y);y+=28;return}
      f(10,1);doc.text('Fecha',M,y);doc.text('Categoría',M+70,y);doc.text('Nota',M+190,y);doc.text('Importe',W-M,y,{align:'right'});y+=16;
      l.forEach(g=>{
        const ln=doc.splitTextToSize(g.n||'-',230);
        if(y>730-ln.length*12){doc.addPage();y=60}
        f(10);
        doc.text(g.f.split('-').reverse().join('/'),M,y);
        doc.text(lbl(g.c),M+70,y);
        doc.text(ln,M+190,y);
        doc.text(m2(g.m),W-M,y,{align:'right'});
        y+=ln.length*12+4;
      });
      if(y>740){doc.addPage();y=60}
      f(10,1);doc.text('Total: '+m2(l.reduce((s,g)=>s+g.m,0)),W-M,y+6,{align:'right'});y+=36;
    };
    sec('Ingresos','ingreso');
    if(y>640){doc.addPage();y=60}
    sec('Gastos','gasto');
    const nombre='gastos-'+k+'.pdf';
    if(DL)await DL.save({filename:nombre,data:doc.output('blob')});
    else doc.save(nombre);
    toast('PDF listo');
  }catch(e){if(!e||e.code!=='declined')toast('No se pudo exportar')}
}
render();
</script>
</body>
</html>
